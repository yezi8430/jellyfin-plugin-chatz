name: Build & Release

# 打 tag 就发版：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 发布 Release + 把更新后的 manifest.json 提交回主分支

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 仓库里的 NuGet.Config 配的是国内源，在海外 runner 上反而慢；
      # 这里删掉它，直接用 runner 自带的 nuget.org
      #
      # 版本号从 tag 推导（v1.0.0 -> 1.0.0.0），用 -p:Version 覆盖 csproj 里的默认值，
      # 这样 dll 自身记录的版本和 Release 的版本才是一致的。
      - name: 还原并编译
        run: |
          rm -f NuGet.Config
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          case "$VER" in
            *.*.*.*) ASM="$VER" ;;
            *.*.*)   ASM="${VER}.0" ;;
            *.*)     ASM="${VER}.0.0" ;;
            *)       ASM="${VER}.0.0.0" ;;
          esac
          dotnet build -c Release --tl:off \
            -p:Version="$ASM" -p:AssemblyVersion="$ASM" -p:FileVersion="$ASM"

      # 版本号从 tag 推导：v1.0.0 -> 1.0.0.0（Jellyfin 要求 4 段）
      - name: 推导版本号并打包
        id: pack
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          case "$VER" in
            *.*.*.*) ASM="$VER" ;;
            *.*.*)   ASM="${VER}.0" ;;
            *.*)     ASM="${VER}.0.0" ;;
            *)       ASM="${VER}.0.0.0" ;;
          esac
          ZIP="Chatz-${ASM}.zip"
          # -j：zip 里直接放 dll，不要带 bin/Release/... 的目录层级
          # （Jellyfin 解压后要能在根目录找到 dll）
          zip -j "$ZIP" bin/Release/net10.0/Chatz.dll
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "version=$ASM"  >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP"      >> "$GITHUB_OUTPUT"

      # checksum 必须在这里算 —— 它是 zip 的 MD5，Jellyfin 下载时会校验
      - name: 更新 manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.pack.outputs.tag }}/${{ steps.pack.outputs.zip }}"
          python3 .github/scripts/update_manifest.py \
            "${{ steps.pack.outputs.zip }}" \
            "${{ steps.pack.outputs.version }}" \
            "$URL" \
            "发布 ${{ steps.pack.outputs.version }}"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.zip }}
            manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # manifest.json 也作为 Release 资产一起上传，方便对照/回滚。
      #
      # ⚠️ 这里**故意不把 manifest.json 提交回主分支**。原因有两个：
      #   1) CI checkout 的是 tag（detached HEAD），要写回 main 得 fetch+rebase+push，
      #      实测不稳 —— v1.0.2 就出现了「Release 发了、zip 能下，但 main 上的
      #      manifest 还是旧版本」的情况，用户在 Jellyfin 里根本看不到新版本。
      #   2) CI 一改 main，你本地下次 push 就会被 non-fast-forward 拒绝（踩过一次）。
      #
      #   ⇒ 改成：本地跑 tools/bump-manifest.py <tag>，它会自动下 zip 算 MD5、
      #     写进 manifest.json，你再 commit + push。
      #      仓库只有你一个人写 manifest，永远不会冲突。
      - name: 提示：记得更新 manifest.json
        run: |
          echo "::notice::Release ${{ steps.pack.outputs.tag }} 已发布。接下来在本地仓库执行："
          echo "  python tools/bump-manifest.py ${{ steps.pack.outputs.tag }}"
          echo "  git add manifest.json"
          echo "  git commit -m 'chore: 更新 manifest.json (${{ steps.pack.outputs.version }})'"
          echo "  git push"
        env:
          MAIN_BRANCH: main
